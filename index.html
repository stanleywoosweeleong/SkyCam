<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SkyCam</title>
<meta name="theme-color" content="#0b0f17">
<meta name="description" content="SkyCam — a photo camera for sky and clouds, with multiple on-screen graduated ND filters, sky looks, long exposure and interval shooting.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SkyCam">
<meta property="og:title" content="SkyCam 天空相机">
<meta property="og:description" content="Sky & cloud camera with on-screen graduated ND filters">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#141414;--bg:#ece8df;--panel:#fff;--red:#e20612;--sky:#3d8bfd;--black:#0b0f17}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;touch-action:manipulation}
html{font-size:17px}html.fs2{font-size:19px}html.fs3{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-weight:500;line-height:1.45;-webkit-text-size-adjust:100%}
body.cam{background:#000;color:#fff}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
main{max-width:540px;margin:0 auto;padding:env(safe-area-inset-top) .75rem calc(env(safe-area-inset-bottom) + .6rem)}
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#000;z-index:20}
section.view{display:none}section.view.on{display:block}
section.view.fit.on{display:flex;flex-direction:column;height:calc(100vh - var(--chrome,0px));height:var(--avail,calc(100dvh - var(--chrome,0px)));min-height:20rem}
#vhProbe{position:fixed;top:0;bottom:0;left:0;width:0;visibility:hidden;pointer-events:none}
.fit.on>*{flex:none}.fit.on>.grow{flex:1 1 0;min-height:9rem}
.vfwrap{display:flex;justify-content:center;align-items:center;margin:0 -.75rem;background:#000}
/* viewfinder */
.vf{position:relative;margin:0 auto;width:min(100%,20rem);aspect-ratio:3/4;flex:none;background:#000;overflow:hidden}
.vf>canvas#out{display:block;width:100%;height:100%}
#video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
.vf .hist{position:absolute;left:.5rem;bottom:.6rem;width:6.5rem;height:2.4rem;border-radius:4px;pointer-events:none;z-index:3}
.hud{position:absolute;top:.45rem;left:.45rem;right:.45rem;display:flex;gap:.3rem;flex-wrap:wrap;pointer-events:none;z-index:3}
.hud b{background:rgba(0,0,0,.62);color:#fff;font-size:.75rem;font-weight:800;padding:.08rem .45rem;border-radius:6px;font-variant-numeric:tabular-nums}
.hud b.r{background:var(--red)}
.vfwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.1rem;pointer-events:none;z-index:6}
.vfwait.dev{background:rgba(0,0,0,.35)}
.gridov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.gridov line{vector-effect:non-scaling-stroke}
.gridov .sh{stroke:rgba(0,0,0,.35);stroke-width:2.5}
.gridov .ln{stroke:rgba(255,255,255,.75);stroke-width:1}
.level{position:absolute;left:50%;top:50%;width:46%;height:0;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.level i{position:absolute;top:-.75px;left:0;width:100%;height:1.5px;background:#ffd23f;box-shadow:0 0 2px rgba(0,0,0,.7);opacity:.8;transform-origin:50% 50%}
.level.ok i{opacity:1;height:2px;top:-1px;background:#3ddc84}
.gov{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.gov.edit{pointer-events:auto;touch-action:none}
.vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}
.vf .flash.go{opacity:.85;transition:none}
.startbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.2rem;background:linear-gradient(#0b1a33,#2d5f9a 70%,#c9a27a);color:#fff;text-align:center;z-index:8}
.startbox button:disabled{opacity:.75}
.startbox button{min-height:3.4rem;padding:0 1.4rem;white-space:nowrap;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:.6rem}
.startbox p{margin:0;font-size:1rem;font-weight:600;color:#fff;max-width:22rem}
.startbox .err{background:#fff;color:var(--ink);border-left:6px solid var(--red);padding:.6rem .8rem;border-radius:6px;text-align:left}
.cdov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6}
.cdov b{font-size:6rem;font-weight:800;color:#fff;text-shadow:0 0 18px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.cdov.lit{box-shadow:inset 0 0 0 6px var(--red),inset 0 0 60px rgba(226,6,18,.55)}
/* camera controls */
.chip{height:2.6rem;min-width:2.6rem;padding:0 .7rem;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{background:#fff;color:#111}
.chip:disabled{opacity:.35}
.ctlrow{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem;min-height:2.6rem}
.lenses{display:flex;gap:.35rem;flex:1 1 auto;justify-content:flex-start;min-width:0}
.lenses .chip{padding:0 .55rem;min-width:2.9rem}
.evchip{flex:none;margin-left:auto;width:6.4rem;padding:0 .4rem}
.evchip.set,.evedit .evv.set,.evedit #evLock.on{background:var(--red);color:#fff}
.evedit{display:flex;gap:.4rem;flex:1;justify-content:center}
.evedit .evv{min-width:5.2rem}
.panel{flex:none;margin-top:.45rem;color:#fff}
.prow{display:flex;gap:.45rem}
.pchip{flex:1 1 0;min-width:0;height:3rem;border:0;border-radius:10px;background:rgba(255,255,255,.13);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.35rem;padding:0 .45rem;white-space:nowrap}
.pchip span{overflow:hidden;text-overflow:ellipsis}
.pchip svg{flex:none}
.pchip.set{background:var(--sky)}
.sub{background:#161a22;border-radius:12px;padding:0 .6rem .55rem;max-height:34vh;max-height:34dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.subhd{display:flex;align-items:center;gap:.5rem;position:sticky;top:0;background:#161a22;z-index:1;padding:.4rem 0 .3rem}
.subhd h3{flex:1;margin:0;font-size:1rem;font-weight:800;min-width:0}
.subhd .chip{height:2.3rem}
.done{background:#fff!important;color:#111!important}
.hint{font-size:.74rem;color:rgba(255,255,255,.66);margin:0 0 .35rem;font-weight:600;line-height:1.35}
.cap{font-size:.8rem;font-weight:800;color:rgba(255,255,255,.72);margin:.45rem 0 .2rem}
.srow{display:grid;grid-template-columns:5.4rem minmax(0,1fr) 3.9rem;align-items:center;gap:.45rem;min-height:2.35rem}
.slbl{font-size:.82rem;font-weight:800;color:rgba(255,255,255,.82);line-height:1.1}
.sval{height:1.9rem;border-radius:7px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;border:0;padding:0}
.qtrack{--p:0;--a:0;--b:0;--k:1.6rem;position:relative;height:var(--k);touch-action:none;cursor:pointer;outline:none}
.qtrack::before{content:'';position:absolute;left:calc(var(--k)/2);right:calc(var(--k)/2);top:50%;height:6px;margin-top:-3px;border-radius:3px;background:rgba(255,255,255,.2)}
.qfill{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--sky);left:calc(var(--k)/2 + (100% - var(--k))*var(--a));width:calc((100% - var(--k))*var(--b))}
.qthumb{position:absolute;top:0;left:calc((100% - var(--k))*var(--p));width:var(--k);height:var(--k);border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .1s}
.qtrack.drag .qthumb{transform:scale(1.12)}
.qtrack:focus-visible .qthumb{outline:3px solid var(--sky);outline-offset:2px}
.cseg{display:grid;gap:.3rem;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.cseg .chip{height:2.35rem;font-size:.86rem;padding:0 .15rem;min-width:0;width:100%;overflow:hidden}
.cseg.cols .chip{flex-direction:column;gap:.15rem;height:2.9rem;font-size:.68rem;line-height:1}
.cseg.cols .dot{width:.95rem;height:.95rem}
.cgrid{display:grid;gap:.3rem;grid-template-columns:repeat(4,minmax(0,1fr))}
.cgrid .chip{height:2.6rem;font-size:.8rem;padding:0 .2rem;min-width:0;white-space:normal;line-height:1.1;text-align:center}
.glist{display:flex;gap:.35rem;flex-wrap:wrap;margin:.1rem 0 .3rem}
.glist .chip{height:2.3rem;font-size:.88rem;padding:0 .6rem}
.dot{width:.75rem;height:.75rem;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3rem;margin-top:.45rem}
.acts .chip{height:2.4rem;font-size:.88rem;min-width:0}
.acts .chip.del{color:#ff8a80}
.shutterrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:.5rem}
.albumbtn{justify-self:start;width:3.5rem;height:3.5rem;border:2px solid rgba(255,255,255,.55);border-radius:8px;background:#222 center/cover no-repeat;position:relative}
.albumbtn .cnt{position:absolute;top:-.55rem;right:-.55rem;min-width:1.6rem;height:1.6rem;border-radius:.8rem;background:var(--red);color:#fff;font-size:.85rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 .3rem}
.gearbtn{justify-self:end;width:3.5rem;height:3.5rem;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.albumbtn:disabled,.gearbtn:disabled{opacity:.4}
.shutter{position:relative;width:4.6rem;height:4.6rem;border-radius:50%;border:5px solid #fff;background:#000;display:flex;align-items:center;justify-content:center;padding:0}
.shutter i{display:block;width:3.25rem;height:3.25rem;border-radius:50%;background:#fff;transition:all .15s}
.shutter.run i{width:1.8rem;height:1.8rem;border-radius:6px;background:var(--red)}
.shutter:disabled{opacity:.5}
.shlbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;font-size:.85rem;pointer-events:none}
.shutter.run .shlbl{display:none}
.note{margin:.7rem 0 0;font-weight:600;background:var(--panel);color:var(--ink);border-left:6px solid var(--ink);padding:.55rem .75rem;border-radius:6px}
/* settings screen */
h2{font-size:1rem;font-weight:800;margin:.85rem 0 .35rem}
.seg{display:grid;gap:.35rem}
.seg button{min-height:2.9rem;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;font-weight:800;padding:0 .2rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.seg button.on{background:var(--ink);color:#fff}
.cfg{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.cfgbar{flex:none;display:flex;align-items:center;gap:.6rem;padding:calc(env(safe-area-inset-top) + .45rem) .75rem .45rem;background:var(--black);color:#fff}
.cfgbar h2{flex:1;margin:0;font-size:1.15rem;font-weight:800}
.cfgclose{width:2.9rem;height:2.9rem;border:2px solid #fff;border-radius:8px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.cfgbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:540px;margin:0 auto;padding:.3rem .75rem calc(env(safe-area-inset-bottom) + 1rem)}
.cfgdesc{margin:.5rem 0 0;font-weight:600;background:var(--panel);border-left:6px solid var(--ink);border-radius:6px;padding:.5rem .7rem}
.cfgdesc.warn{border-left-color:var(--red);color:#9e2412}
.tog2{grid-template-columns:1fr 1fr}
.tog2 button{justify-content:flex-start;padding:0 .6rem;text-align:left;line-height:1.15}
.fsopts{grid-template-columns:repeat(3,1fr)}
.langopts{grid-template-columns:repeat(4,1fr)}
.ratios{grid-template-columns:repeat(5,minmax(0,1fr));gap:.3rem}
.ratios button{flex-direction:column;gap:.3rem!important;min-height:4.3rem!important;padding:.35rem 0!important;font-variant-numeric:tabular-nums}
.ratios .shp{flex:none;border:3px solid currentColor;border-radius:2px}
.grids{grid-template-columns:repeat(5,1fr)}
.grids button{min-height:3.6rem;padding:.3rem 0}
.grids svg{width:2.1rem;height:2.1rem}
.tips{margin:0;padding-left:1.3rem;font-weight:600}.tips li{margin:.4rem 0}
.ver{margin-top:1rem;font-weight:600}
/* album & viewer */
.topbar{display:flex;align-items:center;gap:.6rem;margin:.6rem 0 .5rem}
.topbar h2{margin:0;font-size:1.2rem;flex:1}
.back{min-height:2.8rem;padding:0 .9rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-weight:800;display:flex;align-items:center;gap:.35rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.tile{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:6px;overflow:hidden;background:#000 center/cover no-repeat}
.tile span{position:absolute;bottom:.3rem;left:.3rem;background:rgba(0,0,0,.75);color:#fff;font-size:.75rem;font-weight:800;padding:.05rem .35rem;border-radius:4px}
.empty{font-weight:600;background:var(--panel);padding:1rem;border-radius:8px}
.mediabox{display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden}
.media{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.info{font-weight:700;margin:.5rem 0}
.actions{display:grid;gap:.5rem;grid-auto-flow:column;grid-auto-columns:1fr}
.big{min-height:3.3rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);font-weight:800;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:0 .8rem;text-align:center}
.big.primary{background:var(--ink);color:#fff}
.big.danger{border-color:var(--red);color:var(--red)}
#vAlbum .note,#vAlbum .ver{color:var(--ink)}
/* language picker */
#lang{position:fixed;inset:0;z-index:50;background:linear-gradient(#0b1a33,#2d5f9a);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:2rem}
#lang.on{display:flex}
#lang .t{font-size:1.5rem;font-weight:800;text-align:center;line-height:1.35}
#lang button{width:min(18rem,80vw);min-height:3.6rem;border:0;border-radius:10px;background:#fff;color:var(--ink);font-size:1.25rem;font-weight:800}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 1rem);transform:translateX(-50%);background:#111;color:#fff;font-weight:800;padding:.7rem 1.1rem;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>

<div class="sbar"></div>

<main>
<!-- CAMERA -->
<section class="view fit on" id="vCam">
  <div class="vfwrap grow" id="vfwrap"><div class="vf" id="vf">
    <canvas id="out" width="720" height="960"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <div class="hud" id="hud"></div>
    <canvas class="hist" id="hist" width="128" height="48" hidden></canvas>
    <svg class="gridov" id="gridOv" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" hidden></svg>
    <div class="level" id="levelOv" hidden><i id="lvBar"></i></div>
    <canvas class="gov" id="gov"></canvas>
    <div class="flash" id="flash"></div>
    <div class="cdov" id="cdOv" hidden><b id="cdNum"></b></div>
    <div class="vfwait" id="vfWait" hidden><span data-i="starting"></span></div>
    <div class="vfwait dev" id="vfDev" hidden><span data-i="developing"></span></div>
    <div class="startbox" id="startbox">
      <button id="startBtn"><svg width="26" height="26"><use href="#i-cam"/></svg><span data-i="start"></span></button>
      <p id="startMsg"></p>
    </div>
  </div></div>

  <div class="ctlrow">
    <div class="lenses" id="lensbar" hidden></div>
    <button class="chip evchip" id="evChip" aria-label="EV"><svg id="evLockI" hidden width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg><span>EV</span><span id="evChipT">±0</span></button>
    <div class="evedit" id="evctl" hidden>
      <button class="chip" id="evMinus" aria-label="EV −"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>

// generic slider: drag or tap anywhere on the track; tap the value to reset
function mkSlider(o){

  const tr=document.createElement('div');tr.className='qtrack';tr.tabIndex=0;tr.setAttribute('role','slider');tr.innerHTML='<i class="qfill"></i><i class="qthumb"></i>';
  const val=document.createElement('button');val.className='sval';

  const sync=()=>{const v=o.get(),p=(v-o.min)/(o.max-o.min),z=o.bi?(0-o.min)/(o.max-o.min):0;

  const fromX=x=>{const r=tr.getBoundingClientRect(),pad=r.height/2;return q(o.min+clamp((x-r.left-pad)/(r.width-2*pad),0,1)*(o.max-o.min))};

  tr.addEventListener('pointermove',e=>{if(drag){o.set(fromX(e.clientX));sync()}});
  const end=()=>{if(drag){drag=false;tr.classList.remove('drag');o.done&&o.done()}};

  row.append(lb,tr,val);row.sync=sync;sync();return row;
}

// Horizon level: roll from device orientation; turns green within 0.5°
let lvOn=false,lvListening=false,lvLast=0;
function onOrient(e){
  if(e.beta==null||e.gamma==null)return;const now=performance.now();if(now-lvLast<33)return;lvLast=now;
  const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180,ux=-Math.cos(b)*Math.sin(g),uy=Math.sin(b),mag=Math.hypot(ux,uy);
  const ov=$('levelOv');if(!lvOn||mag<.35){ov.hidden=true;return}
  const roll=Math.atan2(ux,uy)*180/Math.PI,near=Math.round(roll/90)*90,off=roll-near,ok=Math.abs(off)<.5;
  ov.hidden=false;ov.classList.toggle('ok',ok);ov.style.transform=`translate(-50%,-50%) rotate(${near}deg)`;$('lvBar').style.transform=`rotate(${ok?0:off}deg)`;
}
async function setLevel(on,fromTap){
  $('lvWarn').hidden=true;const warn=m=>{$('lvWarn').textContent=m;$('lvWarn').hidden=false;toast(m,5000)};
  if(on&&typeof DeviceOrientationEvent==='undefined'){warn(t('lvNone'));on=false}
  if(on&&typeof DeviceOrientationEvent.requestPermission==='function'){
    if(!fromTap){S.level=true;lvOn=false;$('levelOv').hidden=true;renderCfg();return}   // iOS: ask on the next tap
    try{if(await DeviceOrientationEvent.requestPermission()!=='granted'){warn(t('lvDenied'));on=false}}catch(e){warn(t('lvDenied'));on=false}
  }
  S.level=on;saveS();lvOn=on;
  if(on&&!lvListening){addEventListener('deviceorientation',onOrient);lvListening=true}
  if(!on)$('levelOv').hidden=true;renderCfg();
}

  freeUrls();const g=$('grid');g.innerHTML='';
  const items=(await DB.all()).sort((a,b)=>b.created-a.created);$('empty').hidden=!!items.length;
  for(const it of items){const b=document.createElement('button');b.className='tile';b.style.backgroundImage=`url(${keepUrl(URL.createObjectURL(it.thumb))})`;
    const tag=itemTag(it);if(tag){const s=document.createElement('span');s.textContent=tag;b.appendChild(s)}b.onclick=()=>openItem(it);g.appendChild(b)}
}
let curItem=null,viewUrl=null;
function openItem(it){
  curItem=it;if(viewUrl)URL.revokeObjectURL(viewUrl);viewUrl=URL.createObjectURL(it.blob);
  const box=$('mediaBox');box.innerHTML='';const im=document.createElement('img');im.className='media';im.src=viewUrl;im.alt='';box.appendChild(im);
  $('viewInfo').textContent=[fmtDate(it.created),it.res,itemTag(it),it.ev&&it.ev!=='±0'?'EV '+it.ev:''].filter(Boolean).join(' · ');
  go('vView');
}
function fileName(it){const d=new Date(it.created);return`${d.getFullYear()}-${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}_skycam.jpg`}
async function saveOrShare(blob,name){
  if(NATIVE){const r=await native('savePhoto',{data:await blobB64(blob)});toast(r&&r.ok?t('savedPhotos'):(r&&r.error||'error'));return}
  const file=new File([blob],name,{type:blob.type}),touch=matchMedia('(pointer:coarse)').matches;
  if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  if(touch)toast(t('shareFail'));
}
$('shareBtn').onclick=()=>{if(curItem)saveOrShare(curItem.blob,fileName(curItem))};
$('delBtn').onclick=async()=>{if(!curItem||!confirm(t('confirmDel')))return;await DB.del(curItem.id);curItem=null;refreshAlbumBtn();go('vAlbum')};

/* ============ fit to screen ============ */
function fitLayout(){
  const m=getComputedStyle(document.querySelector('main')),chrome=Math.ceil(parseFloat(m.paddingTop)+parseFloat(m.paddingBottom));
  const H=Math.max($('vhProbe').offsetHeight,innerHeight,document.documentElement.clientHeight);
  const r=document.documentElement.style;r.setProperty('--chrome',chrome+'px');r.setProperty('--avail',Math.floor(H-chrome)+'px');
}
function previewDims(){const r=SW/SH,vw=$('vf').clientWidth||400,dpr=Math.min(window.devicePixelRatio||1,3);
  let w=Math.min(vw*dpr,SW),h=w/r;const c=1280/Math.max(w,h);if(c<1){w*=c;h*=c}return[even(w),even(h)]}
function sizeVf(){const w=$('vfwrap');if(!w.clientHeight)return;$('vf').style.width=Math.floor(Math.max(120,Math.min(w.clientWidth,w.clientHeight*SW/SH)))+'px';
  const[pw,ph]=previewDims();if(out.width!==pw||out.height!==ph){out.width=pw;out.height=ph}drawGov()}
function applySizes(){
  const r=ratioR();let[pw,ph]=srcW?fitRatio(srcW,srcH,r):dimsFromShort(1440,r);pw/=digZoom;ph/=digZoom;
  const k=Math.min(4096,GLR.maxDim||4096)/Math.max(pw,ph);if(k<1){pw*=k;ph*=k}
  SW=even(pw);SH=even(ph);$('vf').style.aspectRatio=SW+' / '+SH;sizeVf();
}
function applyFs(){document.documentElement.classList.remove('fs2','fs3');if(S.fs>1)document.documentElement.classList.add('fs'+S.fs);fitLayout();renderCfg()}
function applyLang(){
  const L=S.lang||'en';document.documentElement.lang={zh:'zh-Hans',zht:'zh-Hant'}[L]||L;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  document.title=t('appName');$('startMsg').textContent=t('tagline');
  $('ver').textContent=$('ver2').textContent=t('appName')+' v'+APP_VERSION;
  renderMain();renderCfg();renderShutter();hud();openPanel(panel);if(camOn)renderLens();
}
if(window.ResizeObserver)new ResizeObserver(sizeVf).observe($('vfwrap'));
addEventListener('resize',fitLayout);
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
addEventListener('orientationchange',()=>setTimeout(fitLayout,300));

/* ============ boot ============ */
// A stale or hand-edited saved setting must never break the screen: anything unknown falls back to its default.
if(S.lang&&!T[S.lang])S.lang=null;if(!RATIOS.some(r=>r[0]===S.ratio))S.ratio='3:4';if(!GRIDS[S.grid])S.grid='g3';if(![1,2,3].includes(+S.fs))S.fs=1;
if(!LOOKS[S.look])S.look='natural';if(!S.adj||typeof S.adj!=='object')S.adj={};for(const k in S.adj)if(!ADJ_KEYS.includes(k)||typeof S.adj[k]!=='number')delete S.adj[k];
if(!SLOWS.includes(+S.slow))S.slow=0;else S.slow=+S.slow;if(!TIMERS.includes(+S.timer))S.timer=0;else S.timer=+S.timer;if(!IVS.includes(+S.iv))S.iv=0;else S.iv=+S.iv;
S.gnd=(Array.isArray(S.gnd)&&S.keep?S.gnd:[]).filter(g=>g&&typeof g==='object').slice(0,MAXG).map(g=>{const n=newGnd();for(const k of['cx','cy','a','st','f'])if(Number.isFinite(+g[k]))n[k]=+g[k];
  if(TY[g.ty]!=null)n.ty=g.ty;if(GCOL[g.col])n.col=g.col;n.st=clamp(n.st,.3,4);n.f=clamp(n.f,.02,.8);return n});
S.lens='1';
$('hist').hidden=!S.hist;renderGrid();applyFs();applySizes();applyLang();fitLayout();refreshAlbumBtn();renderEV();
if(!S.lang)$('lang').classList.add('on');
if(S.level){setLevel(true,false);addEventListener('pointerup',()=>{if(S.level&&!lvOn)setLevel(true,true)},{once:true})}
$('evMinus').onclick=()=>stepEV(-1);$('evPlus').onclick=()=>stepEV(1);$('evVal').onclick=()=>stepEV(0);$('evLock').onclick=()=>{setAeLock(!aeLock);evEdit(true)};$('evChip').onclick=()=>evEdit(true);$('evDone').onclick=()=>evEdit(false);
$('startBtn').onclick=startCam;
if(S.lang)startCam();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
